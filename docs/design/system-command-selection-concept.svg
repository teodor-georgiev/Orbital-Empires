<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Orbital Empires system-command concept: ship selection, defense outpost, and deploy controls</title>
<desc id="desc">Original desktop and mobile mockup of the existing solar view extended with visible hulls, a defensive station, drag-selection marquee, and a compact ship-command overlay.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#17344e"/><stop offset=".7" stop-color="#071929"/><stop offset="1" stop-color="#030a15"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#fff8de"/><stop offset=".42" stop-color="#ffd18d"/><stop offset="1" stop-color="#a75634"/></radialGradient>
 <linearGradient id="metal"><stop stop-color="#dcf6fc"/><stop offset=".5" stop-color="#638ca5"/><stop offset="1" stop-color="#284960"/></linearGradient>
 <g id="corvette"><path d="M 0,-25 L -8,-3 L -23,8 L -23,15 L -5,7 L -5,17 L 0,12 L 5,17 L 5,7 L 23,15 L 23,8 L 8,-3 Z" fill="url(#metal)" stroke="#a1d8e9"/><path d="M -5,18 L -5,27 L 0,23 L 5,27 L 5,18" fill="#6deafa"/></g>
 <g id="station"><path d="M 0,-68 L 12,-18 L 62,-8 L 26,8 L 43,44 L 0,26 L -43,44 L -26,8 L -62,-8 L -12,-18 Z" fill="url(#metal)" stroke="#91cedf" stroke-width="3"/><circle r="17" fill="#1a5b70" stroke="#9ae3e8" stroke-width="5"/><circle r="7" fill="#d4dbe1"/></g>
</defs>
<rect width="1400" height="820" fill="#030915"/>
<text x="28" y="36" fill="#8fe7ef" font-family="Arial" font-size="22" font-weight="bold">ORBITAL EMPIRES / SYSTEM COMMAND — ORIGINAL VISUAL TARGET</text>
<text x="28" y="59" fill="#a2b8c7" font-family="Arial" font-size="14">Concept only · not a gameplay screenshot · proposed overlay to existing solar UI</text>
<rect x="24" y="78" width="1030" height="711" rx="15" fill="url(#bg)" stroke="#365d72" stroke-width="2"/>
<g stroke="#4f92a2" stroke-opacity=".23" fill="none"><ellipse cx="490" cy="428" rx="156" ry="79"/><ellipse cx="490" cy="428" rx="300" ry="151"/><ellipse cx="490" cy="428" rx="420" ry="216"/></g>
<g fill="#a0d9e9"><circle cx="112" cy="129" r="1.5"/><circle cx="900" cy="159" r="2"/><circle cx="813" cy="636" r="1"/><circle cx="243" cy="615" r="1.6"/><circle cx="959" cy="695" r="1"/></g>
<circle cx="490" cy="428" r="45" fill="url(#sun)"/><circle cx="490" cy="428" r="69" fill="#f9ad60" opacity=".07"/>
