<text x="1117" y="493" fill="#85b8c7" font-family="Arial" font-size="11">TAP ORBIT / DOCK / DEPLOY</text>
<g font-family="Arial" font-size="15" text-anchor="middle" fill="#e7f8f9">
<rect x="1097" y="539" width="124" height="45" rx="6" fill="#205768"/><text x="1159" y="567">ORBIT</text>
<rect x="1232" y="539" width="124" height="45" rx="6" fill="#205768"/><text x="1294" y="567">DOCK</text>
<rect x="1097" y="595" width="259" height="46" rx="6" fill="#a67940"/><text x="1227" y="624">DEPLOY TO SELECTED PLANET</text>
</g>
<text x="1098" y="690" fill="#9abcc7" font-family="Arial" font-size="14">Touch: tap selection, buttons</text>
<text x="1098" y="710" fill="#9abcc7" font-family="Arial" font-size="14">No browser right-click required</text>
</svg>