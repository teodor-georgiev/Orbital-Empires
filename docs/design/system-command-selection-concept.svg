<rect x="217" y="404" width="195" height="132" rx="5" fill="#69eaf2" fill-opacity=".07" stroke="#74edf0" stroke-width="2" stroke-dasharray="9 6"/>
<g fill="none" stroke="#8dfaff" stroke-width="3"><circle cx="265" cy="450" r="43"/><circle cx="309" cy="493" r="43"/><circle cx="357" cy="466" r="40"/></g>
<path d="M 361,469 Q 510,545 723,530" fill="none" stroke="#7fefec" stroke-width="3" stroke-dasharray="11 9"/>
<path d="M 723,530 L 704,519 L 708,539 Z" fill="#8ceae7"/>
<text x="615" y="482" fill="#acecf0" font-family="Arial" font-size="14">DEPLOY → MARS</text>
