<circle cx="731" cy="526" r="16" fill="#aa675a"/><text x="739" y="558" fill="#c6d5db" font-family="Arial" font-size="15">Mars</text>
<g transform="translate(565,310) scale(.55)"><use href="#station"/></g>
<rect x="578" y="284" width="106" height="44" rx="7" fill="#112c3b" stroke="#6ecad5"/>
<text x="588" y="301" fill="#a3eaf1" font-family="Arial" font-size="12">SOL OUTPOST</text><text x="588" y="318" fill="#e3f6f5" font-family="Arial" font-size="15" font-weight="bold">DEF 18</text>
<g transform="translate(265,450) rotate(-24) scale(1.5)"><use href="#corvette"/></g>
<g transform="translate(309,493) rotate(-24) scale(1.5)"><use href="#corvette"/></g>
