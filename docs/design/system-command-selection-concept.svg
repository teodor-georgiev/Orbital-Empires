<text x="762" y="145" fill="#dde8ee" font-family="Arial" font-size="14">3 × Corvette · 15 fleet power</text>
<g font-family="Arial" font-size="15" text-anchor="middle" fill="#d5eff1">
<rect x="760" y="160" width="121" height="36" rx="6" fill="#245b65"/><text x="821" y="184">ORBIT</text>
<rect x="895" y="160" width="116" height="36" rx="6" fill="#245b65"/><text x="953" y="184">DOCK</text>
<rect x="760" y="206" width="121" height="36" rx="6" fill="#245b65"/><text x="821" y="230">PATROL</text>
<rect x="895" y="206" width="116" height="36" rx="6" fill="#245b65"/><text x="953" y="230">DEFEND</text>
<rect x="760" y="252" width="251" height="37" rx="6" fill="#a67940"/><text x="885" y="277" fill="#fff">SPLIT / MERGE FLEET</text>
</g>
<text x="45" y="753" fill="#92b5c6" font-family="Arial" font-size="14">LEFT CLICK = SELECT · DRAG = BOX SELECT · SHIFT = ADD · RIGHT CLICK = ORDER · ALT + DRAG = ORBIT CAMERA</text>
<rect x="1075" y="78" width="303" height="711" rx="15" fill="#071522" stroke="#365d72" stroke-width="2"/>
