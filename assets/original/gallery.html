<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital Empires — Original Asset Gallery</title><style>:root{color-scheme:dark}body{margin:0;background:#06101d;color:#e7f5fa;font:16px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:32px 20px 70px}h1{font-size:28px;margin:0 0 8px}p{color:#9eafc2;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px}.tile{background:#101d2e;border:1px solid #284155;border-radius:16px;padding:14px}.tile img{display:block;width:100%;aspect-ratio:1;background:radial-gradient(circle,#1b354e 0,#091522 75%);border-radius:10px;object-fit:contain}.tile strong{display:block;margin:9px 0 2px}.tile small{color:#9eafc2;text-transform:uppercase;letter-spacing:.06em}.tile a{color:#99e9f1;text-decoration:none}.category{margin:28px 0 12px;font-size:21px}</style></head><body><main><h1>Orbital Empires / Original Art Library</h1><p>Editable, transparent-background vector sprites. These assets are authored for this game. Third-party CC0 packages are listed separately in the repository’s license documentation.</p><div id="catalog"></div></main><script type="module">const data=await (await fetch("./catalog.json")).json();const root=document.querySelector("#catalog");for(const category of ["ships","planets","stations","emblems"]){const section=document.createElement("section");const h=document.createElement("h2");h.className="category";h.textContent=category[0].toUpperCase()+category.slice(1);section.append(h);const grid=document.createElement("div");grid.className="grid";for(const item of data.assets.filter(item=>item.category===category)){const card=document.createElement("div");card.className="tile";const img=document.createElement("img");img.src=item.path;img.loading="lazy";img.alt=item.name;const strong=document.createElement("strong");strong.textContent=item.name;const small=document.createElement("small");small.textContent="Original vector SVG";const a=document.createElement("a");a.href=item.path;a.textContent="Open SVG";card.append(img,strong,small,a);grid.append(card)}section.append(grid);root.append(section)}</script></body></html>
