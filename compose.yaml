services:
  game:
    build: .
    image: orbital-empires:local
    container_name: orbital-empires
    restart: unless-stopped
    ports:
      # Only listen on host loopback: use your existing HTTPS reverse proxy.
      - "127.0.0.1:8087:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
