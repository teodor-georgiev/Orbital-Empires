name: Game validation
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check app.js
          node --check core.js
          node --check sw.js
          node --check solar-view.js
          node --check system-model.js
      - name: Run simulation tests
        run: npm test
      - name: Validate standalone PWA assets
        run: |
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("manifest.webmanifest","utf8"));for(const i of m.icons){if(!fs.existsSync(i.src))process.exit(1)}for(const f of ["index.html","app.js","core.js","solar-view.js","system-model.js","style.css","sw.js"]){if(!fs.existsSync(f))process.exit(1)}if(!fs.readFileSync("index.html","utf8").includes("manifest.webmanifest"))process.exit(1);console.log("PWA assets OK")'

  browser-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Install pinned browser test driver
        run: npm install --no-save --ignore-scripts --package-lock=false playwright-core@1.56.1
      - name: Test responsive gameplay in isolated browser
        run: |
          node --check scripts/browser-smoke.mjs
          node scripts/browser-smoke.mjs
      - name: Store browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-browser-smoke
          path: artifacts/*.png
          if-no-files-found: ignore

  release-playwright:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Test real gameplay in Chromium on desktop and mobile
        run: npx playwright test --config=e2e/playwright.config.mjs
      - name: Upload screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-release-browser-qa
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
